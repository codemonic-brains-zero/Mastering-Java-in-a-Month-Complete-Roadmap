<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Data structure and algorithm selection map</title>
  <desc id="desc">Problem constraints lead to a data structure choice such as array, map, tree, heap, or graph, then to a technique such as search, two pointers, recursion, greedy choice, or dynamic programming. Complexity and edge-case validation close the problem-solving loop.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="408" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">PROBLEM SOLVING / CONSTRAINTS GUIDE THE TOOL</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="124" width="190" height="78" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="92" y="157" fill="#4ce9ff" font-size="15" font-weight="700">Constraints</text>
    <text x="77" y="182" fill="#b7cfc4" font-size="12">input • order • limits</text>
    <path d="M238 163h36" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="282" y="104" width="230" height="118" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="332" y="135" fill="#a8fff0" font-size="14" font-weight="700">Data structure</text>
    <text x="310" y="162" fill="#87a99a" font-family="monospace" font-size="12">array / map / tree</text>
    <text x="310" y="187" fill="#87a99a" font-family="monospace" font-size="12">heap / graph / queue</text>
    <path d="M512 163h36" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="556" y="104" width="230" height="118" rx="11" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="614" y="135" fill="#d0c8ff" font-size="14" font-weight="700">Technique</text>
    <text x="582" y="162" fill="#b7a8ff" font-family="monospace" font-size="12">search / two pointers</text>
    <text x="582" y="187" fill="#b7a8ff" font-family="monospace" font-size="12">recursion / DP / greedy</text>
    <path d="M786 163h36" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="830" y="124" width="82" height="78" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="838" y="154" fill="#bdefff" font-family="monospace" font-size="11">solution</text>
    <text x="837" y="180" fill="#87a99a" font-size="11">prove</text>

    <path d="M871 204v75H477v-54" fill="none" stroke="#a58bff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>
    <text x="592" y="270" fill="#b7a8ff" font-size="12">analyze time + space complexity</text>
    <path d="M398 224v77H140v-99" fill="none" stroke="#45ffad" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="173" y="294" fill="#a8fff0" font-size="12">test edge cases and refine</text>

    <rect x="48" y="326" width="864" height="44" rx="9" fill="#0a151b" stroke="#294638"/>
    <text x="75" y="354" fill="#87a99a" font-family="monospace" font-size="12">Define invariant → choose representation → prove steps → test empty, boundary, duplicate, and worst-case inputs.</text>
  </g>
</svg>
