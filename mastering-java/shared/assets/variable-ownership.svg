<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Java variable ownership</title>
  <desc id="desc">A local variable belongs to a method call, instance fields belong to individual objects, and a static field is shared by the class.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">OWNERSHIP / SCOPE MAP</text>
  <g font-family="system-ui, sans-serif">
    <rect x="38" y="80" width="250" height="214" rx="14" fill="#0a151b" stroke="#4ce9ff" stroke-opacity=".65"/>
    <text x="58" y="112" fill="#4ce9ff" font-size="20" font-weight="700">Method call</text>
    <rect x="58" y="137" width="210" height="126" rx="10" fill="#0d2025" stroke="#45ffad" stroke-opacity=".55"/>
    <text x="76" y="172" fill="#a8fff0" font-family="monospace" font-size="16">local: next</text>
    <text x="76" y="203" fill="#b7cfc4" font-size="14">Exists while this call</text>
    <text x="76" y="225" fill="#b7cfc4" font-size="14">is executing</text>

    <rect x="355" y="80" width="250" height="214" rx="14" fill="#0a151b" stroke="#4ce9ff" stroke-opacity=".65"/>
    <text x="375" y="112" fill="#4ce9ff" font-size="20" font-weight="700">Each object</text>
    <rect x="375" y="137" width="210" height="52" rx="9" fill="#0d2025" stroke="#45ffad" stroke-opacity=".55"/>
    <text x="392" y="169" fill="#a8fff0" font-family="monospace" font-size="16">object A: value</text>
    <rect x="375" y="202" width="210" height="52" rx="9" fill="#0d2025" stroke="#45ffad" stroke-opacity=".55"/>
    <text x="392" y="234" fill="#a8fff0" font-family="monospace" font-size="16">object B: value</text>
    <text x="375" y="278" fill="#b7cfc4" font-size="13">Instance fields are per object</text>

    <rect x="672" y="80" width="250" height="214" rx="14" fill="#0a151b" stroke="#a58bff" stroke-opacity=".75"/>
    <text x="692" y="112" fill="#b7a8ff" font-size="20" font-weight="700">Class</text>
    <rect x="692" y="137" width="210" height="72" rx="10" fill="#19152a" stroke="#a58bff" stroke-opacity=".65"/>
    <text x="710" y="169" fill="#d0c8ff" font-family="monospace" font-size="16">static: created</text>
    <text x="710" y="192" fill="#b7cfc4" font-size="13">One shared class field</text>
    <path d="M480 72v-15h317v15" fill="none" stroke="#a58bff" stroke-width="2" filter="url(#glow)"/>
  </g>
  <text x="38" y="334" fill="#87a99a" font-family="monospace" font-size="13">CONCEPTUAL OWNERSHIP — NOT A PROMISE ABOUT JVM MEMORY PLACEMENT</text>
</svg>
