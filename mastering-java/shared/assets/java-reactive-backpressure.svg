<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Reactive stream backpressure and signals</title>
  <desc id="desc">A publisher sends data signals through transformation operators to a subscriber. The subscriber requests bounded demand through its subscription; completion, errors, and cancellation travel as explicit lifecycle signals.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4ce9ff"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="398" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">REACTIVE STREAMS / DEMAND CONTROLS FLOW</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="120" width="170" height="76" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="96" y="152" fill="#4ce9ff" font-size="15" font-weight="700">Publisher</text>
    <text x="81" y="177" fill="#87a99a" font-size="12">data source</text>
    <path d="M218 158h42" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="266" y="120" width="178" height="76" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="305" y="152" fill="#a8fff0" font-family="monospace" font-size="13">operators</text>
    <text x="294" y="177" fill="#87a99a" font-size="12">map / filter / async</text>
    <path d="M444 158h42" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="492" y="120" width="176" height="76" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="540" y="152" fill="#a8fff0" font-family="monospace" font-size="13">Subscriber</text>
    <text x="541" y="177" fill="#87a99a" font-size="12">consume signal</text>
    <path d="M668 158h42" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="716" y="120" width="196" height="76" rx="11" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="766" y="152" fill="#d0c8ff" font-family="monospace" font-size="13">bounded work</text>
    <text x="752" y="177" fill="#b7a8ff" font-size="12">queue / concurrency cap</text>

    <path d="M574 202v83H132v-83" fill="none" stroke="#4ce9ff" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#cyanArrow)"/>
    <text x="280" y="278" fill="#bdefff" font-size="13">request(n) / demand signal travels upstream</text>
    <path d="M852 199v78h-164v-78" fill="none" stroke="#a58bff" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#purpleArrow)"/>
    <text x="726" y="269" fill="#b7a8ff" font-size="11">cancel</text>
    <path d="M38 311h884" stroke="#294638" stroke-width="2"/>
    <rect x="48" y="334" width="252" height="42" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="116" y="361" fill="#bdefff" font-family="monospace" font-size="12">onNext(data)</text>
    <rect x="354" y="334" width="252" height="42" rx="9" fill="#0a151b" stroke="#a58bff"/>
    <text x="414" y="361" fill="#d0c8ff" font-family="monospace" font-size="12">onError(error)</text>
    <rect x="660" y="334" width="252" height="42" rx="9" fill="#0a151b" stroke="#45ffad"/>
    <text x="710" y="361" fill="#a8fff0" font-family="monospace" font-size="12">onComplete()</text>
  </g>
</svg>
