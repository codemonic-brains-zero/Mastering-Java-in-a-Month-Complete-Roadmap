<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Java two-dimensional and jagged array structure</title>
  <desc id="desc">A two-dimensional Java array is an outer array of row references. Rows can have different lengths, so each row must be traversed using its own length.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">NESTED ARRAYS / ROW REFERENCES</text>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="94" fill="#4ce9ff" font-size="18" font-weight="700">int[][] seats</text>
    <rect x="48" y="118" width="168" height="180" rx="12" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="68" y="151" fill="#bdefff" font-family="monospace" font-size="15">outer array</text>
    <g fill="#a8fff0" font-family="monospace" font-size="15">
      <rect x="69" y="169" width="126" height="34" rx="6" fill="#0d2025" stroke="#45ffad"/><text x="82" y="192">seats[0]</text>
      <rect x="69" y="215" width="126" height="34" rx="6" fill="#0d2025" stroke="#45ffad"/><text x="82" y="238">seats[1]</text>
      <rect x="69" y="261" width="126" height="25" rx="6" fill="#15131e" stroke="#a58bff"/><text x="82" y="280">seats[2]</text>
    </g>
    <path d="M216 186h92" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M216 232h92" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M216 274h92" stroke="#a58bff" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="330" y="112" fill="#4ce9ff" font-size="17" font-weight="700">Row 0 · length 2</text>
    <g fill="#a8fff0" font-family="monospace" font-size="15">
      <rect x="330" y="130" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="352" y="159">[0][0]</text>
      <rect x="448" y="130" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="470" y="159">[0][1]</text>
    </g>
    <text x="330" y="205" fill="#4ce9ff" font-size="17" font-weight="700">Row 1 · length 4</text>
    <g fill="#a8fff0" font-family="monospace" font-size="15">
      <rect x="330" y="223" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="352" y="252">[1][0]</text>
      <rect x="448" y="223" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="470" y="252">[1][1]</text>
      <rect x="566" y="223" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="588" y="252">[1][2]</text>
      <rect x="684" y="223" width="110" height="46" rx="7" fill="#0d2025" stroke="#45ffad"/><text x="706" y="252">[1][3]</text>
    </g>
    <rect x="330" y="292" width="230" height="34" rx="7" fill="#15131e" stroke="#a58bff"/>
    <text x="347" y="315" fill="#d0c8ff" font-family="monospace" font-size="14">row 2 is null</text>
    <text x="814" y="187" fill="#b7cfc4" font-size="15">Each row is its</text>
    <text x="814" y="209" fill="#b7cfc4" font-size="15">own array object.</text>
    <text x="814" y="242" fill="#b7a8ff" font-size="14">Lengths can differ;</text>
    <text x="814" y="262" fill="#b7a8ff" font-size="14">null rows need checks.</text>
  </g>
</svg>
