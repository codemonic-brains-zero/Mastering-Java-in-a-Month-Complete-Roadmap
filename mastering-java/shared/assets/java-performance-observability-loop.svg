<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Java performance measurement and observability loop</title>
  <desc id="desc">A representative workload produces latency, throughput, and resource measurements. Profiling identifies CPU, memory, lock, or database bottlenecks; metrics, logs, and traces guide a targeted change, which is remeasured and used for capacity planning.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">PERFORMANCE / MEASURE → DIAGNOSE → VERIFY</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="115" width="166" height="78" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="89" y="148" fill="#4ce9ff" font-size="14" font-weight="700">Workload</text>
    <text x="70" y="175" fill="#b7cfc4" font-size="12">representative input</text>
    <path d="M214 154h38" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="260" y="115" width="190" height="78" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="300" y="148" fill="#a8fff0" font-family="monospace" font-size="13">measure</text>
    <text x="284" y="175" fill="#87a99a" font-size="12">latency • throughput • load</text>
    <path d="M450 154h38" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="496" y="115" width="190" height="78" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="531" y="148" fill="#a8fff0" font-family="monospace" font-size="13">profile</text>
    <text x="517" y="175" fill="#87a99a" font-size="12">CPU • heap • locks • SQL</text>
    <path d="M686 154h38" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="732" y="115" width="180" height="78" rx="11" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="773" y="148" fill="#d0c8ff" font-family="monospace" font-size="13">target change</text>
    <text x="758" y="175" fill="#b7a8ff" font-size="12">small, testable hypothesis</text>
    <path d="M822 196v58H355v-59" fill="none" stroke="#a58bff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>
    <text x="526" y="248" fill="#b7a8ff" font-size="12">re-measure against the baseline</text>

    <path d="M38 278h884" stroke="#294638" stroke-width="2"/>
    <text x="48" y="312" fill="#45ffad" font-size="15" font-weight="700">Operational signals</text>
    <rect x="48" y="332" width="230" height="44" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="127" y="360" fill="#bdefff" font-family="monospace" font-size="13">metrics</text>
    <rect x="365" y="332" width="230" height="44" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="449" y="360" fill="#bdefff" font-family="monospace" font-size="13">logs</text>
    <rect x="682" y="332" width="230" height="44" rx="9" fill="#0a151b" stroke="#a58bff"/>
    <text x="759" y="360" fill="#d0c8ff" font-family="monospace" font-size="13">traces + capacity</text>
    <text x="48" y="402" fill="#87a99a" font-family="monospace" font-size="12">Protect dumps and telemetry; diagnostics may contain sensitive user or credential data.</text>
  </g>
</svg>
