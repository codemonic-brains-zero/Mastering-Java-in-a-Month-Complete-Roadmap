<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Java primitive types</title>
  <desc id="desc">Java primitives grouped as four integral types, two floating-point types, one character type, and one boolean type.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="398" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">JAVA / 8 PRIMITIVE TYPES</text>
  <g font-family="system-ui, sans-serif">
    <rect x="38" y="78" width="425" height="270" rx="15" fill="#0a151b" stroke="#4ce9ff" stroke-opacity=".6"/>
    <text x="62" y="113" fill="#4ce9ff" font-size="20" font-weight="700">Integral · whole numbers</text>
    <g fill="#a8fff0" font-family="monospace" font-size="22">
      <rect x="62" y="139" width="164" height="66" rx="10" fill="#0d2025" stroke="#45ffad" stroke-opacity=".5"/><text x="82" y="180">byte</text>
      <rect x="247" y="139" width="184" height="66" rx="10" fill="#0d2025" stroke="#45ffad" stroke-opacity=".5"/><text x="267" y="180">short</text>
      <rect x="62" y="224" width="164" height="66" rx="10" fill="#0d2025" stroke="#45ffad" stroke-opacity=".5"/><text x="82" y="265">int</text>
      <rect x="247" y="224" width="184" height="66" rx="10" fill="#0d2025" stroke="#45ffad" stroke-opacity=".5"/><text x="267" y="265">long</text>
    </g>
    <rect x="497" y="78" width="425" height="140" rx="15" fill="#0a151b" stroke="#a58bff" stroke-opacity=".7"/>
    <text x="521" y="113" fill="#b7a8ff" font-size="20" font-weight="700">Floating point · approximate</text>
    <g fill="#d0c8ff" font-family="monospace" font-size="22">
      <rect x="521" y="139" width="164" height="58" rx="10" fill="#19152a" stroke="#a58bff" stroke-opacity=".6"/><text x="541" y="176">float</text>
      <rect x="706" y="139" width="184" height="58" rx="10" fill="#19152a" stroke="#a58bff" stroke-opacity=".6"/><text x="726" y="176">double</text>
    </g>
    <rect x="497" y="238" width="198" height="110" rx="15" fill="#0a151b" stroke="#45ffad" stroke-opacity=".65"/>
    <text x="519" y="270" fill="#45ffad" font-size="17" font-weight="700">Character</text>
    <text x="519" y="316" fill="#a8fff0" font-family="monospace" font-size="22">char</text>
    <rect x="724" y="238" width="198" height="110" rx="15" fill="#0a151b" stroke="#ff57d5" stroke-opacity=".65"/>
    <text x="746" y="270" fill="#ff87df" font-size="17" font-weight="700">Truth value</text>
    <text x="746" y="316" fill="#ffc6f0" font-family="monospace" font-size="22">boolean</text>
  </g>
  <text x="38" y="379" fill="#87a99a" font-family="monospace" font-size="13">char = ONE UTF-16 CODE UNIT · float / double ARE NOT EXACT DECIMAL TYPES</text>
</svg>
