<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Microservices topology and resilient communication</title>
  <desc id="desc">Clients enter through an API gateway and service discovery routes requests to independently owned services and databases. Services communicate over synchronous APIs or asynchronous message queues, with tracing and resilience controls across boundaries.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4ce9ff"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="418" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">DISTRIBUTED SYSTEMS / SERVICE OWNERSHIP + FAILURE BOUNDARIES</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="107" width="130" height="68" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="87" y="137" fill="#4ce9ff" font-size="14" font-weight="700">Client</text>
    <text x="68" y="160" fill="#b7cfc4" font-size="12">HTTP</text>
    <path d="M178 141h30" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="214" y="107" width="144" height="68" rx="10" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="244" y="137" fill="#a8fff0" font-family="monospace" font-size="13">API gateway</text>
    <text x="238" y="160" fill="#87a99a" font-size="12">edge policies</text>
    <path d="M358 141h30" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="394" y="89" width="210" height="104" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="435" y="121" fill="#a8fff0" font-family="monospace" font-size="13">Service discovery</text>
    <rect x="415" y="139" width="75" height="38" rx="8" fill="#081116" stroke="#4ce9ff"/>
    <text x="429" y="163" fill="#bdefff" font-size="11">Service A</text>
    <rect x="507" y="139" width="75" height="38" rx="8" fill="#081116" stroke="#4ce9ff"/>
    <text x="521" y="163" fill="#bdefff" font-size="11">Service B</text>
    <path d="M604 141h32" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="642" y="107" width="122" height="68" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="670" y="137" fill="#bdefff" font-family="monospace" font-size="13">Service A</text>
    <text x="667" y="160" fill="#87a99a" font-size="12">owned data</text>
    <path d="M764 141h28" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="798" y="107" width="116" height="68" rx="10" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="830" y="137" fill="#d0c8ff" font-family="monospace" font-size="13">Service B</text>
    <text x="826" y="160" fill="#b7a8ff" font-size="12">owned data</text>

    <path d="M701 177v56H454v-40" fill="none" stroke="#4ce9ff" stroke-width="2.5" marker-end="url(#cyanArrow)"/>
    <text x="512" y="224" fill="#bdefff" font-size="12">sync API call + timeout</text>
    <rect x="265" y="251" width="414" height="65" rx="11" fill="#0a151b" stroke="#a58bff" stroke-width="2"/>
    <text x="402" y="279" fill="#d0c8ff" font-family="monospace" font-size="14">message broker</text>
    <text x="326" y="301" fill="#b7a8ff" font-size="12">async events • retries • idempotent consumers</text>
    <path d="M701 176v92H679" fill="none" stroke="#a58bff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>
    <path d="M265 283H143V176" fill="none" stroke="#a58bff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>

    <path d="M38 340h884" stroke="#294638" stroke-width="2"/>
    <text x="48" y="374" fill="#45ffad" font-family="monospace" font-size="12">Deadlines + circuit breakers + logs + metrics + trace context make partial failure visible and bounded.</text>
  </g>
</svg>
