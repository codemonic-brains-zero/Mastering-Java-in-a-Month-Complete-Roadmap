<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Java byte streams and character streams</title>
  <desc id="desc">Binary data uses InputStream and OutputStream. Text uses Reader and Writer, with a charset encoder or decoder converting between characters and bytes at file boundaries.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4ce9ff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">JAVA I/O / BINARY BYTES VS ENCODED TEXT</text>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="91" fill="#4ce9ff" font-size="17" font-weight="700">Binary data — bytes stay uninterpreted</text>
    <rect x="48" y="108" width="190" height="58" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="73" y="144" fill="#bdefff" font-family="monospace" font-size="15">InputStream</text>
    <path d="M238 137h80" stroke="#4ce9ff" stroke-width="2.5" marker-end="url(#cyanArrow)"/>
    <rect x="330" y="108" width="190" height="58" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="381" y="144" fill="#bdefff" font-family="monospace" font-size="15">raw bytes</text>
    <path d="M520 137h80" stroke="#4ce9ff" stroke-width="2.5" marker-end="url(#cyanArrow)"/>
    <rect x="612" y="108" width="190" height="58" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="635" y="144" fill="#bdefff" font-family="monospace" font-size="15">OutputStream</text>

    <path d="M38 190h884" stroke="#294638" stroke-width="2"/>
    <text x="48" y="223" fill="#45ffad" font-size="17" font-weight="700">Text data — charset conversion happens at the byte boundary</text>
    <text x="48" y="267" fill="#87a99a" font-size="12">READ</text>
    <rect x="112" y="241" width="172" height="54" rx="9" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="151" y="274" fill="#bdefff" font-family="monospace" font-size="14">file bytes</text>
    <path d="M284 268h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="328" y="241" width="190" height="54" rx="9" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="351" y="274" fill="#d0c8ff" font-family="monospace" font-size="14">UTF-8 decoder</text>
    <path d="M518 268h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="562" y="241" width="154" height="54" rx="9" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="611" y="274" fill="#a8fff0" font-family="monospace" font-size="14">Reader</text>
    <path d="M716 268h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="760" y="241" width="150" height="54" rx="9" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="791" y="274" fill="#a8fff0" font-family="monospace" font-size="14">characters</text>

    <text x="48" y="357" fill="#87a99a" font-size="12">WRITE</text>
    <rect x="112" y="331" width="172" height="54" rx="9" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="146" y="364" fill="#a8fff0" font-family="monospace" font-size="14">characters</text>
    <path d="M284 358h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="328" y="331" width="190" height="54" rx="9" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="379" y="364" fill="#a8fff0" font-family="monospace" font-size="14">Writer</text>
    <path d="M518 358h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="562" y="331" width="154" height="54" rx="9" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="580" y="364" fill="#d0c8ff" font-family="monospace" font-size="14">UTF-8 encoder</text>
    <path d="M716 358h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="760" y="331" width="150" height="54" rx="9" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="789" y="364" fill="#bdefff" font-family="monospace" font-size="14">file bytes</text>
  </g>
  <text x="48" y="411" fill="#87a99a" font-family="monospace" font-size="12">SPECIFY A CHARSET SUCH AS UTF-8 WHEN CONVERTING TEXT AND BYTES.</text>
</svg>
