<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Java concurrency task execution and coordination</title>
  <desc id="desc">Tasks are submitted to an executor that schedules platform or virtual threads. Futures carry results back, while locks, atomics, and queues coordinate shared state and messages.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="398" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">CONCURRENCY / TASKS, EXECUTION, COORDINATION</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="128" width="180" height="88" rx="12" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="96" y="162" fill="#4ce9ff" font-size="16" font-weight="700">Task</text>
    <text x="71" y="190" fill="#b7cfc4" font-family="monospace" font-size="13">Runnable / Callable</text>
    <path d="M228 172h56" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="296" y="128" width="190" height="88" rx="12" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="336" y="162" fill="#a8fff0" font-size="16" font-weight="700">Executor</text>
    <text x="323" y="190" fill="#87a99a" font-size="13">lifecycle + policy</text>
    <path d="M486 172h56" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="554" y="102" width="164" height="62" rx="10" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="582" y="139" fill="#a8fff0" font-family="monospace" font-size="14">platform thread</text>
    <rect x="554" y="180" width="164" height="62" rx="10" fill="#0a151b" stroke="#a58bff" stroke-width="2"/>
    <text x="582" y="217" fill="#d0c8ff" font-family="monospace" font-size="14">virtual thread</text>
    <path d="M718 133h55v39" fill="none" stroke="#45ffad" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M718 211h55v-39" fill="none" stroke="#a58bff" stroke-width="2" marker-end="url(#purpleArrow)"/>
    <rect x="784" y="128" width="128" height="88" rx="12" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="814" y="162" fill="#d0c8ff" font-family="monospace" font-size="15">Future</text>
    <text x="801" y="190" fill="#b7a8ff" font-size="12">result / cancel</text>
    <path d="M848 216v50H442v-42" fill="none" stroke="#a58bff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#purpleArrow)"/>
    <text x="583" y="257" fill="#b7a8ff" font-size="12">completion signal</text>

    <path d="M48 292h864" stroke="#294638" stroke-width="2"/>
    <text x="48" y="324" fill="#45ffad" font-size="15" font-weight="700">Coordination choices for shared state and messages</text>
    <rect x="48" y="342" width="178" height="38" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="91" y="367" fill="#bdefff" font-family="monospace" font-size="13">lock / monitor</text>
    <rect x="256" y="342" width="178" height="38" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="300" y="367" fill="#bdefff" font-family="monospace" font-size="13">atomic value</text>
    <rect x="464" y="342" width="178" height="38" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="507" y="367" fill="#bdefff" font-family="monospace" font-size="13">blocking queue</text>
    <rect x="672" y="342" width="240" height="38" rx="9" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="719" y="367" fill="#bdefff" font-family="monospace" font-size="13">immutable messages</text>
  </g>
</svg>
