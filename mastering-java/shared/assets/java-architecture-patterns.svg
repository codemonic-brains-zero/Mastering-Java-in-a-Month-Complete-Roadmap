<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Layered and hexagonal architecture boundaries</title>
  <desc id="desc">A request enters an outer adapter and application use case, then reaches domain policy and persistence through a port implemented by an adapter. Supporting pattern examples show strategy selection and a decorated service without changing the domain core.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a58bff"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">ARCHITECTURE / POLICY CORE + REPLACEABLE ADAPTERS</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="113" width="154" height="72" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="89" y="145" fill="#4ce9ff" font-size="15" font-weight="700">HTTP adapter</text>
    <text x="82" y="169" fill="#87a99a" font-size="12">controller</text>
    <path d="M202 149h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="244" y="113" width="166" height="72" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="274" y="145" fill="#a8fff0" font-family="monospace" font-size="13">use case</text>
    <text x="272" y="169" fill="#87a99a" font-size="12">application policy</text>
    <path d="M410 149h34" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="452" y="100" width="216" height="98" rx="13" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="515" y="137" fill="#d0c8ff" font-size="15" font-weight="700">Domain core</text>
    <text x="484" y="164" fill="#b7a8ff" font-family="monospace" font-size="12">entities + invariants</text>
    <text x="496" y="184" fill="#b7a8ff" font-size="11">independent of framework</text>
    <path d="M668 149h34" stroke="#a58bff" stroke-width="2.5" marker-end="url(#purpleArrow)"/>
    <rect x="710" y="113" width="190" height="72" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="743" y="145" fill="#bdefff" font-family="monospace" font-size="13">repository port</text>
    <text x="761" y="169" fill="#87a99a" font-size="12">abstraction</text>
    <path d="M805 185v61H616v-44" fill="none" stroke="#4ce9ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="655" y="239" fill="#bdefff" font-size="12">database adapter implements port</text>

    <path d="M38 270h884" stroke="#294638" stroke-width="2"/>
    <text x="48" y="307" fill="#45ffad" font-size="15" font-weight="700">Focused patterns support variation at boundaries</text>
    <rect x="48" y="328" width="238" height="60" rx="10" fill="#0a151b" stroke="#4ce9ff"/>
    <text x="89" y="354" fill="#bdefff" font-family="monospace" font-size="13">Strategy / Factory</text>
    <text x="81" y="376" fill="#87a99a" font-size="11">select interchangeable behavior</text>
    <rect x="361" y="328" width="238" height="60" rx="10" fill="#0a151b" stroke="#45ffad"/>
    <text x="410" y="354" fill="#a8fff0" font-family="monospace" font-size="13">Decorator / Adapter</text>
    <text x="393" y="376" fill="#87a99a" font-size="11">compose or translate behavior</text>
    <rect x="674" y="328" width="238" height="60" rx="10" fill="#0a151b" stroke="#a58bff"/>
    <text x="716" y="354" fill="#d0c8ff" font-family="monospace" font-size="13">Observer / Command</text>
    <text x="714" y="376" fill="#b7a8ff" font-size="11">model events or deferred work</text>
  </g>
</svg>
