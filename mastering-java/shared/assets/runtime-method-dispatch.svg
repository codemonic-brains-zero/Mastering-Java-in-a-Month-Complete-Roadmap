<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Java runtime method dispatch</title>
  <desc id="desc">A Circle-typed reference points to a UnitCircle object. The compiler checks the declared type, then runtime dispatch invokes the object's overridden area method.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">POLYMORPHISM / RUNTIME METHOD DISPATCH</text>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="104" width="250" height="86" rx="12" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="70" y="136" fill="#4ce9ff" font-size="17" font-weight="700">Declared reference type</text>
    <text x="70" y="166" fill="#a8fff0" font-family="monospace" font-size="16">Circle shape</text>
    <path d="M298 147h108" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="320" y="130" fill="#87a99a" font-size="13">refers to</text>
    <rect x="424" y="104" width="238" height="86" rx="12" fill="#0a151b" stroke="#a58bff" stroke-width="2"/>
    <text x="446" y="136" fill="#b7a8ff" font-size="17" font-weight="700">Actual object</text>
    <text x="446" y="166" fill="#d0c8ff" font-family="monospace" font-size="16">new UnitCircle()</text>
    <path d="M543 190v64h155" fill="none" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="716" y="218" width="190" height="76" rx="12" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="738" y="249" fill="#a8fff0" font-family="monospace" font-size="16">UnitCircle.area()</text>
    <text x="738" y="274" fill="#b7cfc4" font-size="13">implementation runs</text>
    <rect x="48" y="228" width="270" height="66" rx="10" fill="#0a151b" stroke="#294638"/>
    <text x="68" y="256" fill="#b7cfc4" font-size="14">Compile time: type checks the call</text>
    <text x="68" y="278" fill="#b7cfc4" font-size="14">Runtime: object selects override</text>
    <path d="M318 261h82" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="414" y="272" fill="#87a99a" font-size="13">area()</text>
  </g>
</svg>
