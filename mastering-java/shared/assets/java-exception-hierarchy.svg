<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Java Throwable exception hierarchy</title>
  <desc id="desc">Throwable branches into Error and Exception. Exception branches into checked exceptions and RuntimeException, whose subclasses are unchecked. Errors are distinct from application exceptions.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="388" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">JAVA ERRORS / EXCEPTION TYPE TREE</text>
  <g font-family="system-ui, sans-serif">
    <rect x="361" y="72" width="238" height="56" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="438" y="107" fill="#4ce9ff" font-family="monospace" font-size="19">Throwable</text>

    <rect x="104" y="178" width="250" height="62" rx="11" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <text x="199" y="205" fill="#d0c8ff" font-family="monospace" font-size="18">Error</text>
    <text x="134" y="226" fill="#b7a8ff" font-size="12">serious JVM/system conditions</text>

    <rect x="606" y="178" width="250" height="62" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="687" y="205" fill="#a8fff0" font-family="monospace" font-size="18">Exception</text>
    <text x="638" y="226" fill="#b7cfc4" font-size="12">application-level failures</text>

    <path d="M405 128L264 166" fill="none" stroke="#a58bff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M555 128L700 166" fill="none" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="442" y="286" width="206" height="58" rx="11" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="471" y="312" fill="#a8fff0" font-family="monospace" font-size="16">RuntimeException</text>
    <text x="480" y="333" fill="#b7cfc4" font-size="12">unchecked branch</text>
    <path d="M700 240L568 274" fill="none" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="680" y="286" width="230" height="58" rx="11" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="704" y="312" fill="#bdefff" font-family="monospace" font-size="15">Other Exception types</text>
    <text x="732" y="333" fill="#b7cfc4" font-size="12">checked branch</text>
    <path d="M759 240L793 274" fill="none" stroke="#4ce9ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <text x="38" y="371" fill="#87a99a" font-family="monospace" font-size="12">CHECKED EXCEPTIONS MUST BE CAUGHT OR DECLARED; ERRORS ARE NOT ORDINARY RECOVERY FLOW.</text>
</svg>
