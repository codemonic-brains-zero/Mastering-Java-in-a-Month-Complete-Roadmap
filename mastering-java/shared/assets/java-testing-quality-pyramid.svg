<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Java testing strategy across quality layers</title>
  <desc id="desc">Many fast unit tests form the base, with integration and contract tests in the middle and a smaller number of end-to-end tests at the top. Continuous integration runs appropriate suites and feeds regression failures back into the test strategy.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0d1b22"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45ffad"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="398" rx="20" fill="url(#panel)" stroke="#45ffad" stroke-opacity=".45"/>
  <text x="38" y="48" fill="#45ffad" font-family="monospace" font-size="15" letter-spacing="3">QUALITY / TEST THE RIGHT BOUNDARY</text>
  <g font-family="system-ui, sans-serif">
    <path d="M86 325L278 86L470 325Z" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <path d="M150 245L278 86L406 245Z" fill="#101d23" stroke="#4ce9ff" stroke-width="2"/>
    <path d="M214 165L278 86L342 165Z" fill="#19152a" stroke="#a58bff" stroke-width="2"/>
    <path d="M121 285h314M178 205h200M246 124h64" stroke="#294638" stroke-width="2"/>
    <text x="239" y="132" fill="#d0c8ff" font-size="12">E2E</text>
    <text x="196" y="231" fill="#bdefff" font-size="13">integration / contracts</text>
    <text x="212" y="294" fill="#a8fff0" font-size="13">many fast unit tests</text>

    <rect x="530" y="105" width="378" height="62" rx="10" fill="#0a151b" stroke="#a58bff" stroke-width="2"/>
    <text x="567" y="133" fill="#d0c8ff" font-family="monospace" font-size="13">End-to-end</text>
    <text x="567" y="154" fill="#b7a8ff" font-size="12">few critical user-visible workflows</text>
    <rect x="530" y="190" width="378" height="62" rx="10" fill="#0a151b" stroke="#4ce9ff" stroke-width="2"/>
    <text x="567" y="218" fill="#bdefff" font-family="monospace" font-size="13">Integration + contract</text>
    <text x="567" y="239" fill="#87a99a" font-size="12">real boundaries, provider-consumer agreement</text>
    <rect x="530" y="275" width="378" height="62" rx="10" fill="#0a151b" stroke="#45ffad" stroke-width="2"/>
    <text x="567" y="303" fill="#a8fff0" font-family="monospace" font-size="13">Unit + mutation feedback</text>
    <text x="567" y="324" fill="#87a99a" font-size="12">fast behavior checks; inspect surviving mutants</text>
    <path d="M530 365H460V340" fill="none" stroke="#45ffad" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="560" y="371" fill="#87a99a" font-family="monospace" font-size="12">Coverage guides investigation; assertions establish behavior.</text>
  </g>
</svg>
